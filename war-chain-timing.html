<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>War Chain Timing - Resilience Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=20260803">
<style>
  :root{
    --hit:var(--info);
    --flag:var(--gold);
    --miss:#6b6c72;
    --bonus:#b48cff;
  }
  .ct h1,.ct h2,.ct h3{font-family:var(--font);text-transform:none;letter-spacing:0;color:var(--text)}
  .ct h1{font-size:23px;font-weight:700;margin:0}
  .ct h2{font-size:15px;font-weight:600;margin:0}
  .ct .panel{margin-bottom:18px}
  .ct .panel h2{margin-bottom:12px}

  .headrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .warpick{margin-left:auto;display:flex;align-items:center;gap:8px}
  .warpick label{color:var(--muted);font-size:13px}
  .warpick select{background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
  #warLabel{color:var(--muted);font-size:13.5px;margin:10px 0 0}

  .paneltop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:12px}

  .statcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .statcard{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:var(--panel-2)}
  .statcard .n{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .statcard .n.flag{color:var(--flag)}
  .statcard .l{color:var(--muted);font-size:12.5px;margin-top:6px}

  .svgbox{width:100%;overflow-x:auto}
  svg{display:block;font-family:inherit;touch-action:none;user-select:none}
  svg text{fill:var(--muted);font-size:11px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;color:var(--muted);font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
  .zoomhint{color:var(--faint);font-size:12px;margin:8px 0 0}
  .zoombar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:rgba(255,215,0,.08);border:1px solid var(--gold);border-radius:8px;padding:9px 14px;margin-bottom:12px;font-size:13.5px}
  .zoombar .zd b{color:var(--text);font-weight:600}
  .zoombar button{margin-left:auto;background:var(--gold);color:#241f00;border:0;border-radius:6px;padding:7px 13px;font:inherit;font-weight:600;cursor:pointer}
  .zoombar button:hover{filter:brightness(1.08)}

  .tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px;margin-bottom:14px}
  .tab{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:13.5px;white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab.active{background:var(--panel);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
  .tab .cnt{color:var(--muted);font-weight:400;margin-left:5px;font-variant-numeric:tabular-nums}
  .tab.active .cnt{color:var(--flag)}

  .ct table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
  .ct th,.ct td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .ct th{color:var(--muted);font-weight:500;font-size:12.5px}
  .ct tbody tr:hover{background:var(--panel-2)}
  .ct tr.clickable{cursor:pointer}
  .tablebox{overflow:auto;max-height:620px}
  .num{text-align:right}
  .name{color:var(--info);text-decoration:none}
  .name:hover{text-decoration:underline}
  .flagval{color:var(--flag);font-weight:600}
  .lossval{color:var(--loss);font-weight:600}
  .statemsg{color:var(--muted);padding:28px 4px;text-align:center}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<script src="/config.js?v=20260803b"></script>
<script src="/auth.js?v=20260803b" defer data-gate></script>
<script src="/nav.js?v=20260803b" defer></script>
</head>
<body>
<div id="site-nav"></div>

<div class="container ct">
  <div class="panel">
    <div class="headrow">
      <h1>War chain timing</h1>
      <div class="warpick">
        <label for="warSelect">War</label>
        <select id="warSelect"><option>Loading…</option></select>
      </div>
    </div>
    <p id="warLabel">Loading wars…</p>
  </div>

  <div class="panel" id="statsPanel">
    <h2 id="statsHeading">Summary</h2>
    <div class="statcards" id="statcards"></div>
  </div>

  <div class="panel">
    <div class="paneltop">
      <h2 id="timelineHeading">Timeline</h2>
      <div class="legend">
        <span><i class="dot" style="background:var(--hit)"></i>Hit</span>
        <span><i class="dot" style="background:var(--flag)"></i>1:30 or less left</span>
        <span><i class="dot" style="background:var(--hit);box-shadow:0 0 0 2px var(--bonus)"></i>Bonus hit</span>
      </div>
    </div>
    <div class="zoombar" id="zoomBar" hidden></div>
    <div class="svgbox" id="overview"></div>
    <p class="statemsg" id="timelineMsg" hidden></p>
    <p class="zoomhint" id="zoomhint" hidden>Drag across the timeline to zoom into a time range.</p>
  </div>

  <div class="panel">
    <div class="tabs" id="viewTabs">
      <button type="button" class="tab active" data-v="all">All hits<span class="cnt" id="cnt-all"></span></button>
      <button type="button" class="tab" data-v="late">Hits at 1:30 or below<span class="cnt" id="cnt-late"></span></button>
      <button type="button" class="tab" data-v="players">By player<span class="cnt" id="cnt-players"></span></button>
      <button type="button" class="tab" data-v="bleeders">Bleeders<span class="cnt" id="cnt-bleeders"></span></button>
      <button type="button" class="tab" data-v="chains">Chains<span class="cnt" id="cnt-chains"></span></button>
    </div>
    <div class="tablebox" id="tableBox"></div>
  </div>
</div>

<script>
/* ============================================================
   War Chain Timing
   War window from v2/faction/rankedwars. Chains from
   v2/faction/chains (real start/end/length/respect). Attacks from
   v2/faction/attacks, mapped into the chain whose window they fall
   in. Within a chain, a hit's "time left" is 300 - (gap since the
   previous hit); 1:30 (90s) or below is what the leader wants to see.
   The timeline zoom is the only filter; tables follow the zoom.
   ============================================================ */
const OUR_FACTION_NAME = "Resilience";
const PROFILE = id => `https://www.torn.com/profiles.php?XID=${id}`;
const nowSec = () => Math.floor(Date.now() / 1000);
const BONUS_SET = new Set([10,25,50,100,250,500,1000,2500,5000,10000,25000,50000,100000]);
const LOST_TO_US = new Set(["Hospitalized","Hospitalised","Mugged","Attacked","Looted"]);

let WARS=[], war=null, W=null;
let hits=[], chains=[], incoming=[];
let filters={from:null, to:null};
let viewMode="all";
let sel=null;

/* ---------- helpers ---------- */
const fmt=t=>new Date(t*1000).toISOString().substr(11,8);
const fmtShort=t=>new Date(t*1000).toISOString().substr(11,5);
const fmtDate=t=>new Date(t*1000).toISOString().slice(0,10);
const mmss=s=>Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const comma=n=>Math.round(n).toLocaleString();
function colour(h){return !h.ok?css("--miss"):h.flagged?css("--flag"):css("--hit")}
function tickStep(span,w){const o=[15,30,60,120,300,600,900,1800,3600,7200,10800,21600];return o.find(s=>span/s<=w/70)||43200}
const $=id=>document.getElementById(id);
const link=(id,name)=>`<a class="name" href="${PROFILE(id)}" target="_blank" rel="noopener">${esc(name)}</a>`;

/* ---------- map attacks into real chains ---------- */
function buildChains(apiChains, atks){
  const cs=apiChains.slice().sort((a,b)=>a.start-b.start)
    .map((c,i)=>({no:i+1,id:c.id,start:c.start,end:c.end,length:c.chain,respect:c.respect,count:0,flagged:0}));
  const chainHits=atks.filter(a=>a.ok);
  cs.forEach(c=>{
    const hs=chainHits.filter(a=>a.ended>=c.start&&a.ended<=c.end).sort((a,b)=>a.ended-b.ended||a.chain-b.chain);
    c.count=hs.length;
    let prev=null;
    hs.forEach(a=>{a.chainNo=c.no;if(prev){a.left=300-(a.ended-prev.ended);a.flagged=a.left<=90}prev=a});
    c.flagged=hs.filter(a=>a.flagged).length;
  });
  return cs;
}

/* ---------- filtering (time window only) ---------- */
const inFrame=t=>t>=filters.from&&t<=filters.to;
const framedHits=()=>hits.filter(h=>inFrame(h.ended));
const framedIncoming=()=>incoming.filter(a=>inFrame(a.ended));
const wholeFrame=()=>filters.from===W.start&&filters.to===W.end;

/* ---------- render ---------- */
function render(){
  if(!hits.length){showMessage("No attacks were recorded for this war.");$("statcards").innerHTML="";return}
  $("timelineMsg").hidden=true;$("zoomhint").hidden=false;
  drawStats();drawTimeline();drawZoomBar();drawTabs();renderView();
  $("timelineHeading").textContent=wholeFrame()?"Timeline: whole war":`Timeline: ${fmt(filters.from)} to ${fmt(filters.to)} TCT`;
}

function card(n,l,flag){return `<div class="statcard"><div class="n${flag?" flag":""}">${n}</div><div class="l">${l}</div></div>`}
function drawStats(){
  const F=framedHits(),ok=F.filter(h=>h.ok),late=F.filter(h=>h.flagged);
  const players=new Set(ok.map(h=>h.attacker_id)).size;
  const chainsN=chains.filter(c=>c.end>=filters.from&&c.start<=filters.to).length;
  const resp=ok.reduce((a,h)=>a+h.respect_gain,0);
  $("statcards").innerHTML=card(ok.length,"chain hits")+card(late.length,"at 1:30 or below",true)+
    card(players,"players hitting")+card(chainsN,"chains")+card(comma(resp),"respect earned");
}

function drawZoomBar(){
  const z=$("zoomBar");
  if(wholeFrame()){z.hidden=true;return}
  z.hidden=false;
  z.innerHTML=`<span class="zd">Zoomed in to <b>${fmt(filters.from)}</b> to <b>${fmt(filters.to)}</b> TCT.</span>`;
  const btn=document.createElement("button");btn.type="button";btn.textContent="Show whole war";
  btn.addEventListener("click",()=>{filters.from=W.start;filters.to=W.end;render()});
  z.appendChild(btn);
}

function drawTabs(){
  const F=framedHits();
  $("cnt-all").textContent=F.length;
  $("cnt-late").textContent=F.filter(h=>h.flagged).length;
  $("cnt-players").textContent=new Set(F.filter(h=>h.ok).map(h=>h.attacker_id)).size;
  $("cnt-bleeders").textContent=new Set(framedIncoming().map(a=>a.id)).size;
  $("cnt-chains").textContent=chains.filter(c=>c.end>=filters.from&&c.start<=filters.to).length;
  document.querySelectorAll("#viewTabs .tab").forEach(t=>t.classList.toggle("active",t.dataset.v===viewMode));
}

/* ---------- views ---------- */
function renderView(){
  if(viewMode==="all")tableHits(framedHits(),"No hits in this time range.",false);
  else if(viewMode==="late")tableHits(framedHits().filter(h=>h.flagged),"No hits at 1:30 or below in this time range.",true);
  else if(viewMode==="players")tablePlayers();
  else if(viewMode==="bleeders")tableBleeders();
  else tableChains();
}

function tableHits(rows,emptyMsg,showLeft){
  const box=$("tableBox");
  rows=rows.slice().sort((a,b)=>a.ended-b.ended);
  if(!rows.length){box.innerHTML=`<p class="statemsg">${esc(emptyMsg)}</p>`;return}
  const head=`<tr><th>Time (TCT)</th><th>Player</th><th>Chain</th><th>Hit no.</th>${showLeft?"<th>Time left</th>":""}<th>Result</th><th>Target</th><th class="num">Respect</th></tr>`;
  const body=rows.map(h=>{
    const left=showLeft?`<td><span class="flagval">${h.left!=null?mmss(h.left):""}</span></td>`:"";
    return `<tr><td>${fmt(h.ended)}</td><td>${link(h.attacker_id,h.attacker_name)}</td><td>${h.chainNo||""}</td><td>${h.chain||""}</td>${left}<td>${esc(h.result)}${h.is_ranked_war?"":" (not war)"}</td><td>${esc(h.defender_name)}</td><td class="num">${h.respect_gain.toFixed(2)}</td></tr>`;
  }).join("");
  box.innerHTML=`<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function tablePlayers(){
  const box=$("tableBox"),by={};
  framedHits().forEach(h=>{const b=by[h.attacker_id]||(by[h.attacker_id]={id:h.attacker_id,name:h.attacker_name,ok:0,late:0,resp:0});
    if(h.ok)b.ok++;if(h.flagged)b.late++;b.resp+=h.respect_gain;});
  const rows=Object.values(by).sort((a,b)=>b.late-a.late||b.ok-a.ok);
  if(!rows.length){box.innerHTML=`<p class="statemsg">No attacks in this time range.</p>`;return}
  const head=`<tr><th>Player</th><th class="num">Hits</th><th class="num">At 1:30 or below</th><th class="num">Respect earned</th></tr>`;
  const body=rows.map(b=>`<tr><td>${link(b.id,b.name)}</td><td class="num">${b.ok}</td><td class="num ${b.late?"flagval":""}">${b.late}</td><td class="num">${comma(b.resp)}</td></tr>`).join("");
  box.innerHTML=`<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function tableBleeders(){
  const box=$("tableBox"),by={};
  framedIncoming().forEach(a=>{const b=by[a.id]||(by[a.id]={id:a.id,name:a.name,bled:0,beaten:0});
    b.bled+=a.respect_loss;if(a.beaten)b.beaten++;});
  const rows=Object.values(by).sort((a,b)=>b.bled-a.bled||b.beaten-a.beaten);
  if(!rows.length){box.innerHTML=`<p class="statemsg">No one on our side lost respect in this time range.</p>`;return}
  const head=`<tr><th>Player</th><th class="num">Respect bled</th><th class="num">Times beaten</th></tr>`;
  const body=rows.map(b=>`<tr><td>${link(b.id,b.name)}</td><td class="num lossval">${comma(b.bled)}</td><td class="num">${b.beaten}</td></tr>`).join("");
  box.innerHTML=`<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function tableChains(){
  const box=$("tableBox");
  const rows=chains.filter(c=>c.end>=filters.from&&c.start<=filters.to);
  if(!rows.length){box.innerHTML=`<p class="statemsg">No chains in this time range.</p>`;return}
  const head=`<tr><th>Chain</th><th>Start (TCT)</th><th>End (TCT)</th><th class="num">Hits</th><th class="num">At 1:30 or below</th><th class="num">Respect</th></tr>`;
  const body=rows.map(c=>`<tr class="clickable" data-c="${c.no}"><td>Chain ${c.no}</td><td>${fmt(c.start)}</td><td>${fmt(c.end)}</td><td class="num">${c.count}</td><td class="num ${c.flagged?"flagval":""}">${c.flagged}</td><td class="num">${comma(c.respect)}</td></tr>`).join("");
  box.innerHTML=`<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  box.querySelectorAll("tr.clickable").forEach(tr=>tr.addEventListener("click",()=>{
    const c=chains.find(x=>x.no===+tr.dataset.c);if(!c)return;
    filters.from=Math.max(W.start,c.start-60);filters.to=Math.min(W.end,c.end+60);viewMode="all";render();
  }));
}

/* ---------- timeline ---------- */
function drawTimeline(){
  const box=$("overview"),w=Math.max(box.clientWidth,600),pad=10,F=filters.from,T=filters.to;
  const x=t=>pad+(t-F)/(T-F)*(w-2*pad);
  const px5=300/(T-F)*(w-2*pad);
  const r=Math.max(4,Math.min(14,px5/10)),gap=2*r+2;
  const vis=framedHits();
  const stack={};vis.forEach(h=>{const k=Math.round(x(h.ended)/gap);h._y=stack[k]=(stack[k]||0)+1});
  const maxStack=Math.max(1,...Object.values(stack));
  const top=10,plotH=Math.max(190,Math.min(460,maxStack*gap+24)),h=top+plotH+26,base=top+plotH-8;
  const labelHits=px5>=90;   // when zoomed right in, write the time-left on late hits
  const step=tickStep(T-F,w),firstTick=Math.ceil(F/step)*step;
  let s=`<svg width="${w}" height="${h}" role="img" aria-label="War chain timeline">`;
  // vertical gridlines, one per time axis tick
  for(let t=firstTick;t<=T;t+=step)s+=`<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${top+plotH}" stroke="${css("--line")}" stroke-opacity=".5"/>`;
  vis.forEach(h=>{const cy=base-(h._y-1)*gap,rr=h.flagged?r+1.5:r;
    s+=`<circle cx="${x(h.ended)}" cy="${cy}" r="${rr}" fill="${colour(h)}"${h.bonus?` stroke="${css("--bonus")}" stroke-width="2.5"`:""}><title>${esc(h.attacker_name)} at ${fmt(h.ended)}\n${h.result}${h.chain?", chain "+h.chain:""}${h.bonus?" (bonus)":""}${h.left!=null?"\n"+mmss(h.left)+" left":""}</title></circle>`;
    if(labelHits&&h.flagged)s+=`<text x="${x(h.ended)}" y="${cy-rr-3}" text-anchor="middle" style="fill:${css("--flag")};font-weight:600">${mmss(h.left)}</text>`;});
  s+=`<line x1="${pad}" x2="${w-pad}" y1="${top+plotH}" y2="${top+plotH}" stroke="${css("--line")}"/>`;
  for(let t=firstTick;t<=T;t+=step)s+=`<text x="${x(t)}" y="${h-7}" text-anchor="middle">${step<60?fmt(t):fmt(t).slice(0,5)}</text>`;
  if(sel)s+=`<rect x="${Math.min(sel.a,sel.b)}" y="${top}" width="${Math.abs(sel.b-sel.a)}" height="${plotH}" fill="${css("--gold")}" fill-opacity=".16" stroke="${css("--gold")}" stroke-dasharray="4 3"/>`;
  s+=`</svg>`;box.innerHTML=s;

  const svg=box.querySelector("svg");
  const rect=()=>svg.getBoundingClientRect();
  const toT=px=>Math.min(T,Math.max(F,F+(px-pad)/(w-2*pad)*(T-F))),px=e=>e.clientX-rect().left;
  svg.addEventListener("pointerdown",e=>{sel={a:px(e),b:px(e)};svg.setPointerCapture(e.pointerId)});
  svg.addEventListener("pointermove",e=>{if(!sel)return;sel.b=px(e);drawTimeline()});
  svg.addEventListener("pointerup",e=>{if(!sel)return;const a=toT(sel.a),b=toT(px(e));const dragged=Math.abs(b-a)>=60;sel=null;
    if(dragged){filters.from=Math.min(a,b);filters.to=Math.max(a,b);render()}else drawTimeline();});
}

function showMessage(msg){
  $("overview").innerHTML="";
  const m=$("timelineMsg");m.textContent=msg;m.hidden=false;
  $("zoomhint").hidden=true;$("zoomBar").hidden=true;
  $("tableBox").innerHTML=`<p class="statemsg">${esc(msg)}</p>`;
}

/* ---------- data ---------- */
async function fetchWars(){
  const data=await tornFetch('v2/faction?selections=rankedwars');
  if(data.error)throw new Error(data.error.error||'API error');
  const wars=(data.rankedwars||[]).filter(w=>w.factions&&w.factions.length===2);
  return wars.map(w=>{
    const ours=w.factions.find(f=>f.name===OUR_FACTION_NAME)||w.factions[0];
    const opp=w.factions.find(f=>f!==ours)||w.factions[1];
    return{id:w.war_id||w.id,start:w.start,end:w.end,ours,opp,
      ongoing:!!w.start&&w.start<=nowSec()&&(!w.end||w.end>nowSec()),
      upcoming:w.start>nowSec()};
  }).sort((a,b)=>b.start-a.start);
}

async function pageAll(firstUrl){
  let url=firstUrl;const out=[];
  while(url){
    const data=await tornFetch(url);
    if(data.error)throw new Error(data.error.error||'API error');
    if(Array.isArray(data.attacks))out.push(...data.attacks);
    else if(Array.isArray(data.chains))out.push(...data.chains);
    url=data._metadata?.links?.prev||data._metadata?.links?.next||null;
  }
  return out;
}

async function fetchWarData(w){
  const end=w.end&&w.end>w.start?w.end:nowSec();
  const [rawAttacks,apiChains]=await Promise.all([
    pageAll(`v2/faction/attacks?from=${w.start}&to=${end}&limit=100&sort=DESC`),
    pageAll(`v2/faction/chains?from=${w.start}&to=${end}&limit=100`)
  ]);
  const ours=w.ours.id;
  const atks=rawAttacks
    .filter(a=>a.attacker?.faction?.id===ours&&a.attacker?.id&&(a.chain||0)>0)
    .map(a=>({ended:a.ended,attacker_id:a.attacker.id,attacker_name:a.attacker.name,
      defender_name:a.defender?.name||"Unknown",result:a.result,chain:a.chain||0,ok:true,
      bonus:BONUS_SET.has(a.chain||0),is_ranked_war:a.is_ranked_war?1:0,respect_gain:a.respect_gain||0}))
    .sort((a,b)=>a.ended-b.ended);
  const inc=rawAttacks
    .filter(a=>a.defender?.faction?.id===ours&&a.defender?.id)
    .map(a=>({ended:a.ended,id:a.defender.id,name:a.defender.name,
      respect_loss:a.respect_loss||0,beaten:LOST_TO_US.has(a.result)}));
  return{attacks:atks,apiChains,incoming:inc};
}

async function loadWar(w){
  war=w;W={id:w.id,start:w.start,end:w.end&&w.end>w.start?w.end:nowSec(),opponent:w.opp?.name||"Opponent"};
  filters={from:W.start,to:W.end};viewMode="all";sel=null;hits=[];chains=[];incoming=[];
  const period=`${fmtDate(W.start)} ${fmtShort(W.start)} to ${fmtShort(W.end)} TCT`;
  if(w.upcoming){
    $("warLabel").textContent=`Upcoming war against ${W.opponent}. Starts ${fmtDate(w.start)} at ${fmtShort(w.start)} TCT.`;
    $("statcards").innerHTML="";$("timelineHeading").textContent="Timeline";
    showMessage(`This war has not started yet. It begins ${fmtDate(w.start)} at ${fmtShort(w.start)} TCT.`);
    return;
  }
  $("warLabel").textContent=`Loading attacks for the war against ${W.opponent}…`;
  showMessage("Loading attacks…");$("statcards").innerHTML="";
  let data;
  try{data=await fetchWarData(w);}
  catch(e){$("warLabel").textContent="Could not load this war: "+e.message;showMessage("Could not load this war: "+e.message);return;}
  if(war!==w)return;
  incoming=data.incoming;
  hits=data.attacks;
  chains=buildChains(data.apiChains,hits);
  $("warLabel").textContent=`${w.ongoing?"Ongoing war":"War"} against ${W.opponent}, ${period}.`;
  render();
}

/* ---------- wiring ---------- */
document.querySelectorAll("#viewTabs .tab").forEach(t=>t.addEventListener("click",()=>{viewMode=t.dataset.v;if(hits.length){drawTabs();renderView()}}));
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(hits.length)drawTimeline()},150)});

(async function init(){
  if(typeof tornFetch!=="function"){await new Promise(r=>addEventListener("DOMContentLoaded",r,{once:true}));}
  let wars;
  try{wars=await fetchWars();}
  catch(e){$("warLabel").textContent="Could not load wars: "+e.message;$("warSelect").innerHTML="";return;}
  if(!wars.length){$("warLabel").textContent="No ranked wars found for this faction.";$("warSelect").innerHTML="";return;}
  WARS=wars;
  const selEl=$("warSelect");
  selEl.innerHTML=wars.map((w,i)=>{
    const tag=w.upcoming?"Upcoming: ":w.ongoing?"Ongoing: ":"";
    return `<option value="${i}">${tag}vs ${esc(w.opp?.name||"Opponent")} (${fmtDate(w.start)})</option>`;
  }).join("");
  let def=wars.findIndex(w=>w.ongoing);
  if(def<0)def=wars.findIndex(w=>w.upcoming);
  if(def<0)def=0;
  selEl.value=String(def);
  selEl.addEventListener("change",()=>loadWar(wars[+selEl.value]));
  loadWar(wars[def]);
})();
</script>
</body>

name: Armoury refresh

# Ongoing monitoring for the admin Armoury page. Each run:
#   1. restores the raw news feed files from cache (state from prior runs),
#   2. catches up new deposits/actions and continues any backfill (rate-limit safe),
#   3. pulls the current weapons+armour inventory,
#   4. rebuilds data/armoury.json and commits it.
#
# Setup needed once:
#   - Add repository secret TORN_KEY (a key with faction news + inventory access).
#   - Actions must have write permission (Settings > Actions > General >
#     Workflow permissions > Read and write).
#
# Note: Torn enforces a daily API read limit. The first several runs mostly
# extend the 12-month action backfill; steady state is a cheap daily catch-up.

on:
  schedule:
    - cron: "20 1 * * *"   # 01:20 UTC daily (after Torn's midnight-TCT reset)
  workflow_dispatch: {}      # allow manual runs

concurrency:
  group: armoury-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Raw feed files are the resume state. Cache keeps them between runs
      # without bloating the repo. The key rotates daily so each run saves a
      # fresh snapshot; restore-keys fall back to the most recent prior cache.
      - name: Restore raw feed cache
        uses: actions/cache@v4
        with:
          path: |
            mug/armooury/raw-armoryDeposit.jsonl
            mug/armooury/raw-armoryAction.jsonl
            mug/armooury/raw-crime.jsonl
          key: armoury-raw-${{ github.run_id }}
          restore-keys: |
            armoury-raw-

      - name: Catch up news feeds
        working-directory: mug/armooury
        env:
          TORN_KEY: ${{ secrets.TORN_KEY }}
        run: |
          node armoury-download.js armoryDeposit 2012-01-01 || true
          node armoury-download.js armoryAction 2025-09-19 || true
          node armoury-download.js crime 2025-01-01 || true

      - name: Pull current inventory
        working-directory: mug/armooury
        env:
          TORN_KEY: ${{ secrets.TORN_KEY }}
        run: |
          rm -f inv-*.json
          for cat in weapons armor; do
            off=0
            while :; do
              curl -s "https://api.torn.com/v2/faction/inventory?cat=$cat&limit=100&offset=$off&key=$TORN_KEY&comment=res-armoury" -o "inv-$cat-$off.json"
              n=$(node -e "process.stdout.write(String((JSON.parse(require('fs').readFileSync('inv-$cat-$off.json')).inventory||[]).length))")
              off=$((off+100))
              [ "$n" -lt 100 ] && break
              sleep 1
            done
          done

      - name: Pull current roster
        working-directory: mug/armooury
        env:
          TORN_KEY: ${{ secrets.TORN_KEY }}
        run: |
          curl -s "https://api.torn.com/v2/faction/members?striptags=true&key=$TORN_KEY&comment=res-armoury" -o roster.json
          node -e "const d=JSON.parse(require('fs').readFileSync('roster.json'));if(!d.members)process.exit(0);console.log('roster members:',d.members.length)"

      - name: Rebuild armoury.json
        working-directory: mug/armooury
        run: node armoury-build.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/armoury.json
          if git diff --staged --quiet; then
            echo "No change in armoury data."
          else
            git commit -m "Armoury: refresh data $(date -u +%Y-%m-%d)"
            git push
          fi

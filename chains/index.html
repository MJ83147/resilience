<html lang="en">
    <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chain Watch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
      <script src="/config.js?v=20260803b"></script>
  <script src="/auth.js?v=20260803b" defer></script>
  <script src="/nav.js?v=20260803b" defer></script>
</head>
<body>
<div id="site-nav"></div>
    
  <header>
    <div class="logo">
      <div class="logo-icon">CW</div>
      Chain Watch
    </div>
    <button onclick="openModal()">Sign Up</button>
  </header>

  <main class="container">
    <section id="schedule">
      <h1>Current Chain Watch Schedule</h1>
      <div id="schedule-table">Loading schedule...</div>
    </section>
  </main>

  <div class="modal-overlay" id="signup-modal">
    <div class="modal">
      <h2>Sign Up for Chain Watch</h2>
      <form id="signup-form">
        <div class="form-group">
          <label for="user">Faction Member</label>
          <select id="user" name="user" required></select>
        </div>
        <div class="form-group">
          <label for="date">Select Date</label>
          <select id="date" name="date" required onchange="updateAvailableHours()"></select>
        </div>
        <div class="form-group">
          <label>Choose Hours (TCT)</label>
          <div id="hour-checkboxes"></div>
        </div>
        <button type="submit">Submit</button>
        <div id="feedback"></div>
      </form>
    </div>
  </div>
<script src="index.js"></script>
</body>

</html>
